# pages.yml — builds the Atlas documentary site and publishes it with GitHub Pages.
# The site is generated from docs/, bench/results/ and git history by site/build.py.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the Updates page lists the full history
          fetch-tags: true
      - name: Build site
        run: |
          python3 -m pip install --user markdown==3.10.3
          python3 site/build.py --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
